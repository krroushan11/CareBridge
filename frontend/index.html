<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareBridge AI</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #18324b; background: #f4f7fa; }
      body { margin: 0; } main { max-width: 1000px; margin: 0 auto; padding: 24px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      .card { background: white; border: 1px solid #d8e2eb; border-radius: 12px; padding: 20px; margin: 16px 0; box-shadow: 0 2px 8px #18324b0d; }
      .auth-card { max-width: 420px; margin: 10vh auto; } h1, h2, h3 { margin-top: 0; }
      label { display: block; font-weight: 600; margin: 12px 0; } input, textarea, select { display: block; box-sizing: border-box; width: 100%; border: 1px solid #aebdca; border-radius: 6px; padding: 10px; margin-top: 6px; font: inherit; } input[type="checkbox"] { display: inline-block; width: auto; margin-right: 6px; }
      textarea { font-family: ui-monospace, monospace; font-size: .9rem; } button { border: 0; border-radius: 6px; padding: 10px 16px; color: white; background: #1769aa; cursor: pointer; font-weight: 700; } button:disabled { opacity: .55; cursor: not-allowed; }
      button.secondary { background: #52697d; } .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
      .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; } .data-card { background: #f7fafc; border-radius: 8px; padding: 14px; border: 1px solid #e1e9ef; } .data-card h3 { text-transform: capitalize; font-size: 1rem; } .data-card p { white-space: pre-wrap; }
      .disclaimer { border-left: 5px solid #c27b00; background: #fffaf0; } .muted, small { color: #5d7284; } .message { min-height: 1.3em; color: #a13b3b; } .success { color: #177245; } .emergency-alert { border: 2px solid #a51d2d; border-radius: 6px; padding: 10px; background: #fff0f0; color: #7a1020; font-weight: 700; } .loading { text-align: center; }
      code { background: #edf2f6; padding: 2px 4px; border-radius: 4px; }
      .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; vertical-align: middle; }
      .badge-pending { background: #fff3cd; color: #7a5b00; } .badge-scheduled { background: #d9ecff; color: #0b4f8a; }
      .badge-completed { background: #d8f3e0; color: #116637; } .badge-cancelled { background: #e8e8e8; color: #555; }
      .badge-missed { background: #fde2e2; color: #99231f; }
      .chip { display: inline-block; background: #eef3f7; border: 1px solid #dbe5ee; border-radius: 999px; padding: 2px 10px; margin: 2px 4px 2px 0; font-size: .8rem; }
      .chip-alert { background: #fde2e2; border-color: #f2b8b5; color: #99231f; font-weight: 700; }
      .metric-row { margin: 6px 0; } .filter-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 10px; } .filter-row label { margin: 0; font-size: .85rem; } .filter-row input, .filter-row select { width: auto; min-width: 130px; }
    </style>
  </head>
  <body>
    <main>
      <h1>CareBridge AI</h1>
      <p>Secure health information support</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
